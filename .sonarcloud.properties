# SonarCloud Automatic Analysis configuration.
#
# The filename matters: Automatic Analysis reads `.sonarcloud.properties`, not
# `sonar-project.properties` (that one is for CI-based analysis and is ignored
# while Automatic Analysis is on). Both were tried — `sonar-project.properties`
# with the same key left all 15 findings in place.
#
# `sverka.config.ts` is generated by `nx g @nx-devkit/sverka:config` and
# regenerated with `--force`, so hand edits to it do not survive. It is
# excluded from analysis for two reasons, both verified against the library
# rather than assumed:
#
#   - Its step declarations read as "useless object instantiation" to Sonar
#     (TS:S2094). @sverka/workflow exports only classes — there is no factory
#     — and registering a step is the constructor's side effect. Dropping the
#     `new` would break the plugin, not clean up the code.
#   - The commands embed shell text, so Sonar suggests `String.raw`. Rewriting
#     the escaping there changes what the shell receives.
#
# The same findings recur on every regeneration, so excluding the file is
# cheaper than re-fighting them; the generator is the right place for a fix.
sonar.projectKey=ThePlenkov_gh-debt
sonar.organization=theplenkov
sonar.exclusions=sverka.config.ts
