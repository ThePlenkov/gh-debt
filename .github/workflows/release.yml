name: Release

concurrency:
  group: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (applied on top of the version in package.json)'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
      dry-run:
        description: 'Dry run (verify only — no tag, publish, or release)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          check-latest: true
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: ./node_modules/.bin/nx run-many -t build

      - name: Typecheck
        run: ./node_modules/.bin/nx run-many -t typecheck

      - name: Test
        run: ./node_modules/.bin/nx run-many -t test

      # Provenance requires the OIDC flow, so there is no NODE_AUTH_TOKEN:
      # with a token in the environment npm skips OIDC and --provenance fails.
      #
      # The bump kind goes through --configuration, not --version: `--version`
      # is a reserved nx CLI flag (it prints the nx version and exits), so the
      # executor's `version` option never receives it. For an explicit x.y.z,
      # set `version` in tools/project.json instead.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          ./node_modules/.bin/nx run tools:release \
            --configuration="$BUMP" \
            --dryRun="$DRY_RUN"
