name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The test glob is quoted on purpose: an unquoted pattern is expanded by
      # the shell, and zsh without globstar collapses `**` so only one file runs.
      - name: Confirm the suite really ran
        run: |
          count=$(npm test --silent 2>&1 | grep -oE '^ℹ tests [0-9]+' | awk '{print $3}')
          echo "tests reported: ${count}"
          if [ -z "${count}" ] || [ "${count}" -lt 36 ]; then
            echo "::error::expected at least 36 tests, got '${count}' — the glob is probably not matching every file"
            exit 1
          fi
